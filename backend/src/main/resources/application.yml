spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: bankflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking?currentSchema=retail_banking}
    username: ${DB_USER:bankflow}
    password: ${DB_PASSWORD:bankflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:retail_banking}
        # dialect removed — Hibernate 6 auto-detects Postgres
  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    schemas: retail_banking
    default-schema: retail_banking
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.orm.jpa: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:bankflow-development-jwt-secret-only-for-local-development-change-in-production-2026}
    expiration: 1h
    issuer: bankflow-api
    audience: bankflow-client

  seed-admin: ${SEED_ADMIN:true}

  default-admin:
    full-name: ${SUPER_ADMIN_NAME:System Administrator}
    email: ${SUPER_ADMIN_EMAIL:admin@bankflow.com}
    password: ${SUPER_ADMIN_PASSWORD:AdminSecretPass123!}

  mail:
    from: ${MAIL_FROM}

  brevo:
    api-key: ${BREVO_API_KEY}
    base-url: https://api.brevo.com

  storage:
    location: ${STORAGE_LOCATION:uploads/kyc}

  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:false}

  kyc:
    notification-enabled: ${KYC_NOTIFICATION_ENABLED:false}

  aws:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${AWS_S3_BUCKET}

  security:
    virus-scan-enabled: ${VIRUS_SCAN_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

rate-limit:
  enabled: true

  login:
    limit: 5
    window: 1m

  register:
    limit: 3
    window: 1h

  forgot-password:
    limit: 3
    window: 1h

  resend-verification:
    limit: 3
    window: 1h

  kyc-upload:
    limit: 5
    window: 1h

  user:
    limit: 100
    window: 60s