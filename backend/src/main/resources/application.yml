spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: bankflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking?currentSchema=retail_banking}
    username: ${DB_USER:chaitanyamahajan}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update} # Allows overriding via env variable in prod
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:retail_banking}
        # dialect removed — Hibernate 6 auto-detects Postgres
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.orm.jpa: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  jwt-secret: ${JWT_SECRET}
  seed-admin: ${SEED_ADMIN:true}
  default-admin:
    full-name: ${SUPER_ADMIN_NAME}
    email: ${SUPER_ADMIN_EMAIL}
    password: ${SUPER_ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never