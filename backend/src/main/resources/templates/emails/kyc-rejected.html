<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>KYC Rejected</title>
</head>

<body style="font-family: Arial, sans-serif; background:#f6f8fb; padding:20px;">

<div style="
        max-width:600px;
        margin:auto;
        background:white;
        padding:30px;
        border:1px solid #ddd;
        border-radius:8px;
">

    <h2>KYC Document Verification Failed ❌</h2>

    <p>
        Hello <span th:text="${name}"></span>,
    </p>

    <p>
        Your submitted
        <b th:text="${documentType}"></b>
        document could not be verified.
    </p>

    <p>
        <b>Reason:</b>
    </p>

    <div style="
        background:#fef2f2;
        color:#991b1b;
        padding:15px;
        border-radius:5px;
    ">
        <span th:text="${reason}"></span>
    </div>

    <br>

    <p>
        Please upload a new document from your BankFlow account.
    </p>

    <br>

    <a th:href="${uploadUrl}"
       style="
       display:inline-block;
       background:#2563eb;
       color:white;
       padding:12px 20px;
       text-decoration:none;
       border-radius:5px;
       ">
        Upload New Document
    </a>

    <br><br>

    <p>
        Regards,<br>
        <b>BankFlow Team</b>
    </p>

</div>

</body>

</html>
