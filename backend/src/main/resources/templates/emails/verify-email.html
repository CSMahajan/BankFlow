<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Verify Email</title>
</head>

<body style="font-family: Arial, sans-serif;">

<div style="
        max-width:600px;
        margin:auto;
        padding:30px;
        border:1px solid #ddd;
        border-radius:8px;
">

    <h2>Welcome to BankFlow 🔐</h2>

    <p>
        Hello <span th:text="${name}"></span>,
    </p>

    <p>
        Thank you for creating your BankFlow account.
    </p>

    <p>
        Please verify your email address to activate your account.
    </p>

    <br>

    <a th:href="${verificationUrl}"
       style="
       background:#2563eb;
       color:white;
       padding:12px 20px;
       text-decoration:none;
       border-radius:5px;
       ">
        Verify Email
    </a>

    <br><br>

    <p>
        This verification link is valid for 24 hours.
    </p>

    <p>
        Regards,<br>
        <b>BankFlow Team</b>
    </p>

</div>

</body>

</html>
